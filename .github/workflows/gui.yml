name: GUI

# Builds the graphical console on a Windows runner and publishes it as a downloadable
# artifact. Separate from the wrapper's own workflow so that either can fail on its own.
on:
  push:
    branches: [ "main" ]
    tags: [ "gui-v*" ]
    paths:
      - "src/WinSW.Gui/**"
      - "src/WinSW.Gui.Tests/**"
      - "src/WinSW.sln"
      # The wrapper is embedded into the console, so its sources are part of this build.
      - "src/WinSW/**"
      - "src/WinSW.Core/**"
      - "src/WinSW.Plugins/**"
      - "src/WinSW.Tasks/**"
      # The cheat sheet is embedded into the executable, so it is part of the build.
      - "docs/xml-config-cheatsheet.md"
      - "docs/xml-config-cheatsheet.zh-CN.md"
      - "Directory.Build.props"
      - ".github/workflows/gui.yml"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Both are for steps that only run on a push or a tag: the release, and the issue filed
# when a build fails. A pull request build needs neither, but Actions has no way to vary
# permissions by event within one job — narrowing them would mean splitting the release
# into a job of its own, which is a bigger change than it is worth here. The steps that
# use them are gated on the event instead.
permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # MSBuild keeps its worker processes alive between invocations so the next build can
      # reuse them. On a runner that is discarded after the job there is nothing to reuse,
      # and a worker that was left in a bad state by the previous invocation is what surfaces
      # as "MSB4166: child node exited prematurely" — which this workflow has hit more than
      # once, unrelated to the commit that happened to be building. Nothing to gain here,
      # so it is switched off.
      MSBUILDDISABLENODEREUSE: 1

    steps:
      # Full history: the wrapper's file version counts the commits that touched it.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # 8.0.x builds the console; 7.0.x is kept for the wrapper, whose project still lists a
      # net7.0-windows target alongside the net462 one this workflow actually builds.
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            7.0.x
            8.0.x

      # Neither workflow cached anything, so every run restored every package from
      # nuget.org. There are no packages.lock.json files here, so setup-dotnet's own
      # cache input has nothing to hash and the project files are used instead.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The version comes from the tag (gui-v1.2.3 → 1.2.3); other builds are 0.0.0-ci.<run>.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME
          $version = if ($ref -match '^gui-v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          $suffix = if ($ref -match '^gui-v') { '' } else { '-ci.' + $env:GITHUB_RUN_NUMBER }
          "version=$version" >> $env:GITHUB_OUTPUT
          "full=$version$suffix" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version$suffix"

      # The console embeds this executable, so it has to exist before the console is built.
      #
      # The audit runs but does not fail the build. The repository compiles warnings as
      # errors, and one advisory against a dependency nobody can fix today would then block
      # every build. Whatever the audit reports is turned into job annotations by the step
      # after this one, so a finding is visible rather than swallowed by a flag.
      #
      # 3.0.0 is the version this branch of the wrapper declares (see eng/build.yml).
      - name: Build the wrapper that ships inside the console
        working-directory: ./src
        shell: pwsh
        run: |
          # %3B, not ';': a semicolon on an MSBuild command line separates properties, so
          # -p:WarningsNotAsErrors=NU1901;NU1902 asks it to set a property named NU1902.
          #
          # The revision counts commits that have touched the wrapper, so it moves when the
          # wrapper changes and not on every rebuild of the console. It also makes this build
          # sort above the last upstream release, whose binaries all report 3.0.0.0 — which
          # is true: this branch is ahead of it.
          $revision = (git rev-list --count HEAD -- WinSW WinSW.Core WinSW.Plugins).Trim()
          Write-Host "Wrapper file version: 3.0.0.$revision"
          dotnet build WinSW -c Release -f net462 -p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904 -p:Version=3.0.0 -p:FileVersion=3.0.0.$revision -p:InformationalVersion=3.0.0+$env:GITHUB_SHA 2>&1 | Tee-Object -FilePath ../wrapper.log
          exit $LASTEXITCODE

      # Advisories against the wrapper's dependencies, as job annotations, so they are read
      # without an authenticated session and without failing an otherwise good build.
      - name: Report dependency advisories
        if: always()
        shell: pwsh
        run: |
          if (Test-Path wrapper.log) {
            Select-String -Path wrapper.log -Pattern 'NU190\d' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique |
              ForEach-Object { Write-Host "::warning::$_" }
          }

      - name: Restore
        working-directory: ./src
        run: dotnet restore WinSW.Gui.Tests

      - name: Build
        working-directory: ./src
        shell: pwsh
        run: |
          dotnet build WinSW.Gui -c Release --no-restore -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.full }} 2>&1 | Tee-Object -FilePath ../build.log
          exit $LASTEXITCODE

      - name: Test
        working-directory: ./src
        shell: pwsh
        run: |
          dotnet test WinSW.Gui.Tests -c Release --no-restore -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.full }} --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath ../test.log
          exit $LASTEXITCODE

      # Self-contained means the whole .NET runtime plus the WPF/WinForms frameworks ride
      # along (~155 MB uncompressed); WPF cannot be trimmed, so compression is the lever.
      - name: Publish (x64, self-contained, single file)
        working-directory: ./src
        run: >
          dotnet publish WinSW.Gui -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.full }}
          -o ../artifacts/gui/win-x64

      # Skipped on a pull request, where these two are self-contained WPF publishes that
      # nobody downloads; a push to main still produces every artifact. The x64 build
      # above runs everywhere, so a publish that breaks is still caught on the branch.
      - name: Publish (x64, framework-dependent)
        if: github.event_name != 'pull_request'
        working-directory: ./src
        run: >
          dotnet publish WinSW.Gui -c Release -r win-x64 --no-self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.full }}
          -o ../artifacts/gui/win-x64-fdd

      # Skipped on a pull request, where these two are self-contained WPF publishes that
      # nobody downloads; a push to main still produces every artifact. The x64 build
      # above runs everywhere, so a publish that breaks is still caught on the branch.
      - name: Publish (arm64, self-contained, single file)
        if: github.event_name != 'pull_request'
        working-directory: ./src
        run: >
          dotnet publish WinSW.Gui -c Release -r win-arm64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.full }}
          -o ../artifacts/gui/win-arm64

      - name: Upload self-contained build
        uses: actions/upload-artifact@v4
        with:
          name: WinSW.Gui-win-x64
          path: artifacts/gui/win-x64/WinSW.Gui.exe
          if-no-files-found: error

      - name: Upload arm64 build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: WinSW.Gui-win-arm64
          path: artifacts/gui/win-arm64/WinSW.Gui.exe
          if-no-files-found: error

      - name: Upload framework-dependent build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: WinSW.Gui-win-x64-framework-dependent
          path: artifacts/gui/win-x64-fdd/WinSW.Gui.exe
          if-no-files-found: error

      # Pushing a tag such as gui-v0.1.0 turns that build into a GitHub Release.
      - name: Stage release files
        if: startsWith(github.ref, 'refs/tags/gui-v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item artifacts/gui/win-x64/WinSW.Gui.exe release/WinSW.Gui-win-x64.exe
          Copy-Item artifacts/gui/win-x64-fdd/WinSW.Gui.exe release/WinSW.Gui-win-x64-framework-dependent.exe
          Copy-Item artifacts/gui/win-arm64/WinSW.Gui.exe release/WinSW.Gui-win-arm64.exe

      # winget manifests with the real hashes, attached to the release for submission to winget-pkgs.
      - name: Stage winget manifests
        if: startsWith(github.ref, 'refs/tags/gui-v')
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $x64 = (Get-FileHash release/WinSW.Gui-win-x64.exe -Algorithm SHA256).Hash
          $arm = (Get-FileHash release/WinSW.Gui-win-arm64.exe -Algorithm SHA256).Hash
          $out = "release/winget/manifests/l/Ly-star-bit/WinSWGui/$version"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem packaging/winget/*.yaml | ForEach-Object {
            (Get-Content $_.FullName -Raw).Replace('__VERSION__', $version).Replace('__SHA256_X64__', $x64).Replace('__SHA256_ARM64__', $arm) |
              Set-Content (Join-Path $out $_.Name) -NoNewline
          }
          Compress-Archive -Path release/winget/manifests -DestinationPath release/winget-manifests.zip
          Remove-Item release/winget -Recurse

      - name: Release
        if: startsWith(github.ref, 'refs/tags/gui-v')
        uses: softprops/action-gh-release@v2
        with:
          name: WinSW GUI ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            | Download | Size | Requires |
            | --- | --- | --- |
            | `WinSW.Gui-win-x64-framework-dependent.exe` | ~7 MB | the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) (x64) |
            | `WinSW.Gui-win-x64.exe` | ~69 MB | nothing — the runtime rides along |
            | `WinSW.Gui-win-arm64.exe` | ~65 MB | nothing — the runtime rides along |

            WinSW itself is carried inside the console, so the new-service wizard installs a
            service on a machine with no network and no WinSW.exe to hand.
          files: |
            release/*.exe
            release/winget-manifests.zip

      # Job logs are only readable when signed in. On any failure, file the compiler and test
      # errors as an issue so they can be read (and fixed) without an authenticated session.
      - name: Report build errors as an issue
        if: failure() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $logs = @('wrapper.log', 'build.log', 'test.log') | Where-Object { Test-Path $_ }
          $errors = Select-String -Path $logs -Pattern 'error [A-Z]+\d+|\[FAIL\]|Failed [A-Za-z_.]+|Error Message|Assert\.|Expected:|Actual:|Exception:' |
            ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 120
          if (-not $errors -and $logs) { $errors = Get-Content $logs[-1] -Tail 80 }
          if (-not $errors) { $errors = @("No wrapper.log, build.log or test.log was produced; the failure is in an earlier step.") }
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = "Build of $env:GITHUB_SHA failed. Run: $run`n`n``````text`n" + ($errors -join "`n") + "`n``````"
          $payload = @{ title = "GUI build failed at $($env:GITHUB_SHA.Substring(0, 7))"; body = $body } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/issues" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" } `
            -Body $payload -ContentType "application/json" | Out-Null
