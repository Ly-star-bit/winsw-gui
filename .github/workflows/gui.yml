name: GUI

# Builds the graphical console on a Windows runner and publishes it as a downloadable
# artifact. Separate from the wrapper's own workflow so that either can fail on its own.
on:
  push:
    branches: [ "main" ]
    tags: [ "gui-v*" ]
    paths:
      - "src/WinSW.Gui/**"
      - "src/WinSW.Gui.Tests/**"
      - "src/WinSW.sln"
      # The cheat sheet is embedded into the executable, so it is part of the build.
      - "docs/xml-config-cheatsheet.md"
      - "docs/xml-config-cheatsheet.zh-CN.md"
      - "Directory.Build.props"
      - ".github/workflows/gui.yml"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Same SDK line as the wrapper's workflow; the GUI targets net7.0-windows to match it.
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 7.0.x

      # The version comes from the tag (gui-v1.2.3 → 1.2.3); other builds are 0.0.0-ci.<run>.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME
          $version = if ($ref -match '^gui-v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          $suffix = if ($ref -match '^gui-v') { '' } else { '-ci.' + $env:GITHUB_RUN_NUMBER }
          "version=$version" >> $env:GITHUB_OUTPUT
          "full=$version$suffix" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version$suffix"

      - name: Restore
        working-directory: ./src
        run: dotnet restore WinSW.Gui.Tests

      - name: Build
        working-directory: ./src
        shell: pwsh
        run: |
          dotnet build WinSW.Gui -c Release --no-restore -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.full }} 2>&1 | Tee-Object -FilePath ../build.log
          exit $LASTEXITCODE

      - name: Test
        working-directory: ./src
        shell: pwsh
        run: |
          dotnet test WinSW.Gui.Tests -c Release --no-restore -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.full }} --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath ../test.log
          exit $LASTEXITCODE

      # Self-contained means the whole .NET runtime plus the WPF/WinForms frameworks ride
      # along (~155 MB uncompressed); WPF cannot be trimmed, so compression is the lever.
      - name: Publish (x64, self-contained, single file)
        working-directory: ./src
        run: >
          dotnet publish WinSW.Gui -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.full }}
          -o ../artifacts/gui/win-x64

      - name: Publish (x64, framework-dependent)
        working-directory: ./src
        run: >
          dotnet publish WinSW.Gui -c Release -r win-x64 --no-self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.full }}
          -o ../artifacts/gui/win-x64-fdd

      - name: Publish (arm64, self-contained, single file)
        working-directory: ./src
        run: >
          dotnet publish WinSW.Gui -c Release -r win-arm64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.full }}
          -o ../artifacts/gui/win-arm64

      - name: Upload self-contained build
        uses: actions/upload-artifact@v4
        with:
          name: WinSW.Gui-win-x64
          path: artifacts/gui/win-x64/WinSW.Gui.exe
          if-no-files-found: error

      - name: Upload arm64 build
        uses: actions/upload-artifact@v4
        with:
          name: WinSW.Gui-win-arm64
          path: artifacts/gui/win-arm64/WinSW.Gui.exe
          if-no-files-found: error

      - name: Upload framework-dependent build
        uses: actions/upload-artifact@v4
        with:
          name: WinSW.Gui-win-x64-framework-dependent
          path: artifacts/gui/win-x64-fdd/WinSW.Gui.exe
          if-no-files-found: error

      # Pushing a tag such as gui-v0.1.0 turns that build into a GitHub Release.
      - name: Stage release files
        if: startsWith(github.ref, 'refs/tags/gui-v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item artifacts/gui/win-x64/WinSW.Gui.exe release/WinSW.Gui-win-x64.exe
          Copy-Item artifacts/gui/win-x64-fdd/WinSW.Gui.exe release/WinSW.Gui-win-x64-framework-dependent.exe
          Copy-Item artifacts/gui/win-arm64/WinSW.Gui.exe release/WinSW.Gui-win-arm64.exe

      # winget manifests with the real hashes, attached to the release for submission to winget-pkgs.
      - name: Stage winget manifests
        if: startsWith(github.ref, 'refs/tags/gui-v')
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $x64 = (Get-FileHash release/WinSW.Gui-win-x64.exe -Algorithm SHA256).Hash
          $arm = (Get-FileHash release/WinSW.Gui-win-arm64.exe -Algorithm SHA256).Hash
          $out = "release/winget/manifests/l/Ly-star-bit/WinSWGui/$version"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem packaging/winget/*.yaml | ForEach-Object {
            (Get-Content $_.FullName -Raw).Replace('__VERSION__', $version).Replace('__SHA256_X64__', $x64).Replace('__SHA256_ARM64__', $arm) |
              Set-Content (Join-Path $out $_.Name) -NoNewline
          }
          Compress-Archive -Path release/winget/manifests -DestinationPath release/winget-manifests.zip
          Remove-Item release/winget -Recurse

      - name: Release
        if: startsWith(github.ref, 'refs/tags/gui-v')
        uses: softprops/action-gh-release@v2
        with:
          name: WinSW GUI ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/winget-manifests.zip

      # Job logs are only readable when signed in. On any failure, file the compiler and test
      # errors as an issue so they can be read (and fixed) without an authenticated session.
      - name: Report build errors as an issue
        if: failure()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $logs = @('build.log', 'test.log') | Where-Object { Test-Path $_ }
          $errors = Select-String -Path $logs -Pattern 'error [A-Z]+\d+|\[FAIL\]|Failed [A-Za-z_.]+|Error Message|Assert\.|Expected:|Actual:|Exception:' |
            ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 120
          if (-not $errors -and $logs) { $errors = Get-Content $logs[-1] -Tail 80 }
          if (-not $errors) { $errors = @("No build.log or test.log was produced; the failure is in an earlier step.") }
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = "Build of $env:GITHUB_SHA failed. Run: $run`n`n``````text`n" + ($errors -join "`n") + "`n``````"
          $payload = @{ title = "GUI build failed at $($env:GITHUB_SHA.Substring(0, 7))"; body = $body } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/issues" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" } `
            -Body $payload -ContentType "application/json" | Out-Null
