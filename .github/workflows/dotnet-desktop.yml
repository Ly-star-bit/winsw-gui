name: .NET Core Desktop

on:
  push:
    branches: [ "v3", "main" ]
  pull_request:
    branches: [ "v3", "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    # Not a pinned image. windows-2019 was retired, and a job asking for a retired
    # image does not fail: it queues for a runner that will never come, which is how
    # this workflow stopped running without anyone noticing.
    runs-on: windows-latest

    env:
      Solution_Name: WinSW.sln
      Test_Project_Path: WinSW.Tests\WinSW.Tests.csproj                 # Replace with the path to your test project, i.e. MyWpfApp.Tests\MyWpfApp.Tests.csproj.
      
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    # 7.0 for the wrapper, 8.0 for the graphical console; the solution holds both, and
    # 'dotnet test' below builds all of it.
    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          7.0.x
          8.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    # Execute all unit tests in the solution
    - name: Execute unit tests
      working-directory: ./src
      run: dotnet test
