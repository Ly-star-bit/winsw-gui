name: .NET Core Desktop

on:
  push:
    branches: [ "v3", "main" ]
  pull_request:
    branches: [ "v3", "main" ]

jobs:

  build:

    strategy:
      # Both configurations report. Cancelling one because the other failed hides
      # whether a failure belongs to the configuration or to the test.
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    # Not a pinned image. windows-2019 was retired, and a job asking for a retired
    # image does not fail: it queues for a runner that will never come, which is how
    # this workflow stopped running without anyone noticing.
    runs-on: windows-latest

    env:
      Solution_Name: WinSW.sln
      Test_Project_Path: WinSW.Tests\WinSW.Tests.csproj                 # Replace with the path to your test project, i.e. MyWpfApp.Tests\MyWpfApp.Tests.csproj.
      
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    # 7.0 for the wrapper, 8.0 for the graphical console; the solution holds both, and
    # 'dotnet test' below builds all of it.
    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          7.0.x
          8.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    # The console embeds this executable, and embeds it only if it is already on disk.
    # A solution-wide build gives no order between the wrapper's ILMerge step and the
    # console's decision, so without this the console is built with nothing inside it
    # and BundledWrapperUnpacksToARealWrapper fails — correctly. The console's own
    # workflow builds it first for the same reason.
    - name: Build the wrapper the console embeds
      working-directory: ./src
      shell: pwsh
      run: |
        dotnet build WinSW -c ${{ matrix.configuration }} -f net462 -p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
        exit $LASTEXITCODE

    # Execute all unit tests in the solution
    - name: Execute unit tests
      working-directory: ./src
      shell: pwsh
      run: |
        dotnet test -c ${{ matrix.configuration }} --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath ../test.log
        exit $LASTEXITCODE

    # Without this the job says only "exit code 1". A compiler error becomes an
    # annotation on its own; a failing test does not, and the log that holds the reason
    # is readable to repository administrators and to nobody else.
    - name: Report failing tests
      if: failure()
      working-directory: ./src
      shell: pwsh
      run: |
        if (-not (Test-Path ../test.log)) { exit 0 }
        $lines = Get-Content ../test.log

        foreach ($line in $lines | Where-Object { $_ -match '^\s*Failed\s+\S' }) {
          Write-Host "::error::$($line.Trim())"
        }

        # The name alone rarely says why. Everything from the first failure onward,
        # capped, goes out as one annotation with the newlines escaped.
        $first = $lines | Select-String -Pattern '^\s*Failed\s+\S' | Select-Object -First 1
        if ($first) {
          $last = [Math]::Min($lines.Count - 1, $first.LineNumber + 120)
          $detail = ($lines[($first.LineNumber - 1)..$last] -join '%0A')
          Write-Host "::error::$detail"
        }
        else {
          $tail = ($lines | Select-Object -Last 60) -join '%0A'
          Write-Host "::error::No test failed; the step failed before or after the run.%0A$tail"
        }
